<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1C1F24">
<title>TaskFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F1F2F3;--surf:#fff;--hov:#F6F6F7;--sel:#F2F7FE;--press:#EDEEEF;
  --pr:#008060;--prh:#006E52;--prs:#EBF9F5;
  --t1:#202223;--t2:#6D7175;--t3:#8C9196;
  --link:#2C6ECB;--succ:#007A5A;--crit:#D72C0D;--warn:#B98900;
  --bd:#E1E3E5;--bds:#EDEEEF;--bdf:#458FFF;
  --nav:#1C1F24;--r:8px;--rr:4px;
  --sc:0 1px 0 rgba(0,0,0,.05),0 0 0 1px rgba(63,63,68,.05),0 1px 3px rgba(63,63,68,.15);
  --sp:0 0 0 1px rgba(63,63,68,.05),0 4px 16px rgba(63,63,68,.18);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#111213;--surf:#1A1B1D;--hov:#202224;--sel:#1C2A3A;--press:#25272A;
  --pr:#007257;--prh:#005B45;--prs:rgba(0,128,96,.15);
  --t1:#E3E5EB;--t2:#9EA4AD;--t3:#6D7175;
  --link:#6BAFE3;--succ:#3FD19F;--crit:#F87171;--warn:#F5C842;
  --bd:#2E3033;--bds:#25272A;
  --sc:0 0 0 1px rgba(255,255,255,.08);--sp:0 0 0 1px rgba(255,255,255,.08),0 4px 20px rgba(0,0,0,.5);
}}
:root[data-theme=dark]{
  --bg:#111213;--surf:#1A1B1D;--hov:#202224;--sel:#1C2A3A;--press:#25272A;
  --pr:#007257;--prh:#005B45;--prs:rgba(0,128,96,.15);
  --t1:#E3E5EB;--t2:#9EA4AD;--t3:#6D7175;
  --link:#6BAFE3;--succ:#3FD19F;--crit:#F87171;--warn:#F5C842;
  --bd:#2E3033;--bds:#25272A;
  --sc:0 0 0 1px rgba(255,255,255,.08);--sp:0 0 0 1px rgba(255,255,255,.08),0 4px 20px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,sans-serif;font-size:14px;line-height:20px;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}
button{cursor:pointer;border:none;background:none;font-family:inherit;font-size:inherit;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--t1);background:var(--surf)}
a{text-decoration:none;color:inherit}

/* ── LOADING ── */
#loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px}
.spin{width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--pr);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LOGIN ── */
#login-screen{display:none;position:fixed;inset:0;background:var(--bg);align-items:center;justify-content:center;z-index:990;padding:20px}
#login-screen.show{display:flex}
.login-card{background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:32px;width:100%;max-width:400px;box-shadow:var(--sp)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.login-logo-icon{width:40px;height:40px;background:#008060;border-radius:10px;display:flex;align-items:center;justify-content:center}
.login-logo-icon svg{width:22px;height:22px}
.login-logo-name{font-size:20px;font-weight:700;letter-spacing:-0.3px}
.login-logo-sub{font-size:12px;color:var(--t2)}
.login-card h2{font-size:18px;font-weight:600;margin-bottom:6px}
.login-card p{font-size:13px;color:var(--t2);margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--t1)}
.form-group input{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:var(--r);font-size:14px;outline:none;transition:border .15s}
.form-group input:focus{border-color:var(--bdf);box-shadow:0 0 0 3px rgba(69,143,255,.15)}
.login-err{background:#FFF4F4;border:1px solid #FEAD9A;border-radius:var(--rr);padding:10px 12px;font-size:13px;color:var(--crit);margin-bottom:16px;display:none}
.login-err.show{display:block}
.btn-primary{width:100%;background:var(--pr);color:#fff;padding:10px;border-radius:var(--r);font-size:14px;font-weight:600;transition:background .15s}
.btn-primary:hover{background:var(--prh)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}

/* ── APP LAYOUT ── */
#app{display:none;height:100%}
#app.show{display:flex}

/* SIDEBAR */
.sb{width:240px;background:var(--nav);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s;overflow:hidden}
.sb-head{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:56px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{width:30px;height:30px;background:#008060;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-logo svg{width:16px;height:16px}
.sb-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.2px}
.sb-close{display:none;color:rgba(255,255,255,.5);padding:6px;margin-left:auto;font-size:20px;line-height:1}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 14px;color:rgba(255,255,255,.7);font-size:13.5px;font-weight:500;cursor:pointer;transition:background .15s;border-radius:0}
.sb-item:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-item.active{background:rgba(255,255,255,.12);color:#fff}
.sb-item svg{width:18px;height:18px;flex-shrink:0;opacity:.8}
.sb-item.active svg{opacity:1}
.sb-sect{padding:16px 14px 4px;font-size:10px;font-weight:600;color:rgba(255,255,255,.35);letter-spacing:1px;text-transform:uppercase}
.sb-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08)}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:#008060;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:#fff;flex-shrink:0}
.sb-uinfo{flex:1;min-width:0}
.sb-uname{font-size:13px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-urole{font-size:11px;color:rgba(255,255,255,.45)}
.sb-logout{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);padding:8px 14px;border-radius:var(--r);font-size:13px;margin-top:8px;width:100%;text-align:left;transition:background .15s}
.sb-logout:hover{background:rgba(255,255,255,.14)}

/* Overlay */
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:98}
.sb-overlay.show{display:block}

/* MAIN */
.main{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100%;overflow:hidden}

/* TOPBAR */
.topbar{height:56px;background:var(--surf);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:50}
.topbar-menu{display:none;color:var(--t2);padding:4px}
.topbar-menu svg{width:22px;height:22px}
.topbar-title{font-size:16px;font-weight:600;flex:1}
.topbar-add{background:var(--pr);color:#fff;padding:7px 14px;border-radius:var(--r);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;transition:background .15s}
.topbar-add:hover{background:var(--prh)}
.topbar-add svg{width:16px;height:16px}

/* CONTENT */
.content{flex:1;padding:20px;overflow-y:auto;padding-bottom:100px}

/* STATS */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sc)}
.stat-card .sl{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-card .sv{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-card.sc-today .sv{color:var(--pr)}
.stat-card.sc-done .sv{color:var(--succ)}
.stat-card.sc-prog .sv{color:var(--link)}
.stat-card.sc-over .sv{color:var(--crit)}

/* PROGRESS */
.prog-wrap{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;margin-bottom:20px;box-shadow:var(--sc)}
.prog-top{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-bottom:8px}
.prog-bar{height:6px;background:var(--bds);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--pr),var(--succ));border-radius:3px;transition:width .4s ease}

/* SECTION TITLE */
.sec-title{font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px}

/* TASK FILTERS */
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.tab-btn{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid var(--bd);color:var(--t2);background:var(--surf);transition:all .15s;white-space:nowrap}
.tab-btn.active{background:var(--pr);border-color:var(--pr);color:#fff}
.filter-sel{padding:6px 10px;border-radius:var(--r);border:1px solid var(--bd);font-size:13px;color:var(--t2);cursor:pointer;background:var(--surf)}
.view-toggle{display:flex;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-left:auto}
.vt-btn{padding:6px 10px;font-size:12px;color:var(--t2);transition:all .15s}
.vt-btn:hover{background:var(--hov)}
.vt-btn.active{background:var(--pr);color:#fff}
.vt-btn svg{width:14px;height:14px}

/* TASK LIST */
.task-list{display:flex;flex-direction:column;gap:6px}
.task-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;display:flex;align-items:flex-start;gap:10px;box-shadow:var(--sc);transition:box-shadow .15s,opacity .2s;cursor:pointer}
.task-card:hover{box-shadow:var(--sp)}
.task-card.done-card{opacity:.45}
.check-btn{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;cursor:pointer}
.check-btn.checked{background:var(--succ);border-color:var(--succ)}
.check-btn svg{display:none;width:12px;height:10px}
.check-btn.checked svg{display:block}
.task-body{flex:1;min-width:0}
.task-title-text{font-size:14px;font-weight:500;line-height:1.4}
.done-card .task-title-text{text-decoration:line-through;color:var(--t2)}
.task-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:500;white-space:nowrap}
.badge-pr-high{background:#FFF0EE;color:#D72C0D}
.badge-pr-medium{background:#FFF7E5;color:#B98900}
.badge-pr-low{background:#F0FBF5;color:#007A5A}
.badge-pr-none{background:var(--bds);color:var(--t2)}
.badge-cat{background:var(--sel);color:var(--link)}
.badge-date{font-size:11px;color:var(--t2)}
.badge-date.overdue{color:var(--crit)}
.badge-date.soon{color:var(--warn)}
.task-del{color:var(--t2);padding:4px 6px;opacity:0;transition:opacity .15s;flex-shrink:0;font-size:18px;line-height:1}
.task-card:hover .task-del{opacity:1}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:12px}
.kb-col{background:var(--bds);border-radius:var(--r);padding:10px;min-height:200px}
.kb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px}
.kb-label{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.kb-dot{width:8px;height:8px;border-radius:50%}
.kb-dot.todo{background:var(--t3)}
.kb-dot.progress{background:var(--link)}
.kb-dot.blocked{background:var(--crit)}
.kb-dot.done{background:var(--succ)}
.kb-dot.cancelled{background:var(--t3)}
.kb-count{font-size:11px;color:var(--t2);background:var(--surf);padding:1px 7px;border-radius:10px}
.kb-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--rr);padding:10px;margin-bottom:6px;cursor:pointer;transition:box-shadow .15s}
.kb-card:hover{box-shadow:var(--sp)}
.kb-card.drag-over{border-color:var(--pr);background:var(--prs)}
.kb-card-title{font-size:13px;font-weight:500;line-height:1.35;margin-bottom:6px}
.kb-card-meta{display:flex;gap:4px;flex-wrap:wrap}
.kb-drop-zone{min-height:60px;border:2px dashed transparent;border-radius:var(--rr);transition:border-color .15s,background .15s}
.kb-drop-zone.drag-over{border-color:var(--pr);background:var(--prs)}

/* ANALYTICS */
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.a-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sc)}
.a-title{font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-lbl{font-size:12px;color:var(--t1);width:90px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:8px;background:var(--bds);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--pr);transition:width .4s}
.bar-val{font-size:12px;color:var(--t2);width:24px;text-align:right;font-variant-numeric:tabular-nums}
.status-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-lbl{font-size:13px;flex:1}
.status-cnt{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}

/* SETTINGS */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.s-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sc)}
.s-title{font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.s-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bds)}
.s-row:last-of-type{border-bottom:none}
.s-row label{font-size:13px;color:var(--t1)}
.s-row select{padding:5px 8px;border:1px solid var(--bd);border-radius:var(--rr);font-size:13px;cursor:pointer}
.toggle{position:relative;width:38px;height:22px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;background:var(--bd);border-radius:11px;transition:background .2s}
.toggle input:checked ~ .toggle-track{background:var(--pr)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle input:checked ~ .toggle-track ~ .toggle-thumb,.toggle input:checked + .toggle-track + .toggle-thumb{transform:translateX(16px)}
.toggle input:checked + .toggle-track::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transform:translateX(16px);transition:transform .2s}

/* Better toggle */
.sw{display:inline-block;position:relative;width:38px;height:22px}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw-track{position:absolute;inset:0;background:var(--bd);border-radius:11px;cursor:pointer;transition:background .2s}
.sw input:checked + .sw-track{background:var(--pr)}
.sw-track::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s}
.sw input:checked + .sw-track::after{transform:translateX(16px)}

.user-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bds)}
.user-row:last-child{border-bottom:none}
.u-avatar{width:32px;height:32px;border-radius:50%;background:var(--pr);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:#fff;flex-shrink:0}
.u-info{flex:1;min-width:0}
.u-name{font-size:13px;font-weight:500}
.u-role{font-size:11px;color:var(--t2)}
.u-del{color:var(--crit);padding:4px;opacity:.6;transition:opacity .15s}
.u-del:hover{opacity:1}
.add-btn{background:var(--pr);color:#fff;padding:7px 14px;border-radius:var(--r);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;margin-top:12px}
.add-btn:hover{background:var(--prh)}
.cat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cat-chip{background:var(--sel);color:var(--link);padding:4px 10px;border-radius:12px;font-size:12px;display:flex;align-items:center;gap:5px}
.cat-chip button{color:var(--link);opacity:.6;font-size:14px;line-height:1}
.cat-chip button:hover{opacity:1}
.cat-add-row{display:flex;gap:8px}
.cat-add-row input{flex:1;padding:7px 10px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px;outline:none}
.cat-add-row input:focus{border-color:var(--bdf)}
.cat-add-row button{background:var(--pr);color:#fff;padding:7px 12px;border-radius:var(--r);font-size:13px;font-weight:500}

/* DASHBOARD SECTIONS */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.d-card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sc)}
.d-title{font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.d-task{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bds);cursor:pointer}
.d-task:last-child{border-bottom:none}
.d-task:hover{background:var(--hov);margin:0 -4px;padding:8px 4px;border-radius:var(--rr)}
.d-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.d-dot.high{background:var(--crit)}
.d-dot.medium{background:var(--warn)}
.d-dot.low{background:var(--succ)}
.d-dot.none{background:var(--t3)}
.d-ttitle{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-date{font-size:11px;color:var(--t2)}
.d-date.overdue{color:var(--crit)}
.d-empty{text-align:center;padding:20px 0;color:var(--t3);font-size:13px}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--surf);border-radius:12px;width:100%;max-width:600px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--sp)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd)}
.modal-head h3{font-size:16px;font-weight:600}
.modal-close{color:var(--t2);font-size:20px;padding:4px;line-height:1}
.modal-body{overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.f-group{display:flex;flex-direction:column;gap:5px}
.f-group label{font-size:12px;font-weight:500;color:var(--t2)}
.f-group input,.f-group select,.f-group textarea{padding:8px 10px;border:1px solid var(--bd);border-radius:var(--r);font-size:14px;outline:none;transition:border .15s;width:100%;resize:vertical}
.f-group input:focus,.f-group select:focus,.f-group textarea:focus{border-color:var(--bdf);box-shadow:0 0 0 3px rgba(69,143,255,.12)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-sec{padding:8px 16px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px;font-weight:500;color:var(--t1);background:var(--surf);transition:background .15s}
.btn-sec:hover{background:var(--hov)}
.btn-pri{padding:8px 16px;background:var(--pr);color:#fff;border-radius:var(--r);font-size:13px;font-weight:600;transition:background .15s}
.btn-pri:hover{background:var(--prh)}
.btn-danger{padding:8px 16px;background:var(--crit);color:#fff;border-radius:var(--r);font-size:13px;font-weight:600}

/* Tags */
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:5px;padding:6px 8px;border:1px solid var(--bd);border-radius:var(--r);cursor:text;min-height:38px;align-items:center;background:var(--surf)}
.tag-input-wrap:focus-within{border-color:var(--bdf);box-shadow:0 0 0 3px rgba(69,143,255,.12)}
.tag-chip{background:var(--sel);color:var(--link);padding:2px 8px;border-radius:10px;font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tag-chip button{color:var(--link);opacity:.7;font-size:14px;line-height:1}
.tag-chip button:hover{opacity:1}
.tag-input-wrap input{border:none;outline:none;font-size:13px;background:transparent;flex:1;min-width:80px;color:var(--t1)}

/* Subtasks */
.sub-list{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.sub-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--bd);border-radius:var(--rr)}
.sub-item input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--pr)}
.sub-item span{flex:1;font-size:13px}
.sub-item.done span{text-decoration:line-through;color:var(--t2)}
.sub-item button{color:var(--t2);opacity:.5;font-size:16px}
.sub-item button:hover{opacity:1;color:var(--crit)}
.sub-add-row{display:flex;gap:6px}
.sub-add-row input{flex:1;padding:6px 10px;border:1px solid var(--bd);border-radius:var(--rr);font-size:13px;outline:none}
.sub-add-row input:focus{border-color:var(--bdf)}
.sub-add-btn{background:var(--pr);color:#fff;padding:6px 12px;border-radius:var(--rr);font-size:12px;font-weight:500}

/* Comments */
.comment-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.comment-item{background:var(--hov);border-radius:var(--rr);padding:8px 10px}
.comment-meta{font-size:11px;color:var(--t2);margin-bottom:3px}
.comment-text{font-size:13px;line-height:1.4}
.comment-add{display:flex;gap:6px}
.comment-add textarea{flex:1;padding:8px 10px;border:1px solid var(--bd);border-radius:var(--rr);font-size:13px;resize:none;outline:none;height:64px}
.comment-add textarea:focus{border-color:var(--bdf)}
.comment-add button{background:var(--pr);color:#fff;padding:8px 12px;border-radius:var(--rr);font-size:12px;font-weight:500;align-self:flex-end}

/* Recurring toggle */
.recur-wrap{border:1px solid var(--bd);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px}
.recur-head{display:flex;align-items:center;justify-content:space-between}
.recur-body{display:none;grid-template-columns:1fr 1fr;gap:10px}
.recur-body.show{display:grid}

/* TOAST */
.toast-wrap{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:min(340px,90vw)}
.toast{background:var(--nav);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.3);animation:toastIn .2s ease;display:flex;align-items:center;gap:8px}
.toast.err{background:#D72C0D}
.toast.ok{background:#007A5A}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* MOBILE BOTTOM NAV */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--bd);z-index:90;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(0,0,0,.08)}
.bn-inner{display:flex;align-items:center;justify-content:space-around;height:56px}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 14px;color:var(--t2);font-size:10px;font-weight:500;transition:color .15s;flex:1;cursor:pointer}
.bn-item.active{color:var(--pr)}
.bn-item svg{width:22px;height:22px}
.bn-fab{width:48px;height:48px;background:var(--pr);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,128,96,.4);flex-shrink:0;margin-top:-8px}
.bn-fab svg{width:22px;height:22px;color:#fff}

/* USER MODAL for add user */
.inline-form{display:flex;flex-direction:column;gap:10px;padding-top:10px;border-top:1px solid var(--bds)}
.inline-form input,.inline-form select{padding:7px 10px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px;outline:none;width:100%}
.inline-form input:focus,.inline-form select:focus{border-color:var(--bdf)}
.inline-form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* RESPONSIVE */
@media(max-width:1023px){
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .analytics-grid,.settings-grid,.dash-grid{grid-template-columns:1fr}
  .kanban{grid-template-columns:repeat(3,minmax(180px,1fr))}
}

@media(max-width:767px){
  .sb{transform:translateX(-100%)}
  .sb.open{transform:translateX(0)}
  .sb-close{display:block}
  .main{margin-left:0}
  .topbar-menu{display:flex}
  .topbar-add{display:none}
  .content{padding:14px;padding-bottom:80px}
  .stat-row{grid-template-columns:repeat(2,1fr);gap:8px}
  .kanban{grid-template-columns:repeat(2,minmax(180px,1fr))}
  .bottom-nav{display:block}

  .filter-bar{gap:6px}
  .view-toggle{display:none}
  .f-row{grid-template-columns:1fr}
}

@media(max-width:480px){

.empty-state svg{width:48px;height:48px;margin-bottom:10px;opacity:.3}
.empty-state p{font-size:14px}

<script>
// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
const S = {
  token: localStorage.getItem('tf-token'),
  user: null,
  tasks: [],
  users: [],
  config: { categories: [] },
  view: 'dashboard',
  taskView: 'list',
  taskTab: 'all',
  filterPriority: '',
  filterCategory: '',
  editingTaskId: null,
  modalTags: [],
  modalSubtasks: [],
  modalComments: [],
};

// ═══════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════
async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(S.token ? { Authorization: 'Bearer ' + S.token } : {})
    }
  };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch('/api' + path, opts);
  if (res.status === 401) { logout(); return null; }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Xato yuz berdi');
  return data;
}

// ═══════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════
async function init() {
  if (!S.token) { showLogin(); return; }
  try {
    S.user = await api('GET', '/me');
    if (!S.user) return;
    await loadAll();
    showApp();
  } catch {
    showLogin();
  }
}

async function doLogin() {
  const login = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  const err = document.getElementById('login-err');
  const btn = document.getElementById('login-btn');
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Kirish...';
  try {
    const data = await api('POST', '/auth/login', { login, password });
    if (!data) { btn.disabled = false; btn.textContent = 'Kirish'; return; }
    S.token = data.token;
    S.user = data.user;
    localStorage.setItem('tf-token', data.token);
    await loadAll();
    showApp();
  } catch (e) {
    err.textContent = e.message;
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Kirish';
  }
}

function logout() {
  S.token = null;
  S.user = null;
  localStorage.removeItem('tf-token');
  document.getElementById('app').classList.remove('show');
  showLogin();
}

function showLogin() {
  document.getElementById('loading-screen').style.display = 'none';

async function loadAll() {
  const [tasks, config] = await Promise.all([
    api('GET', '/tasks'),
    api('GET', '/config')
  ]);
  S.tasks = tasks || [];
  S.config = config || { categories: [] };
  if (S.user?.role === 'admin') {
    S.users = await api('GET', '/users') || [];
  } else {
    S.users = [S.user];
  }
  applyTheme(S.config.theme || 'auto');
}

function renderView() {
  const c = document.getElementById('content');
  if (S.view === 'dashboard') c.innerHTML = renderDashboard();
  else if (S.view === 'tasks') c.innerHTML = renderTasks();
  else if (S.view === 'analytics') c.innerHTML = renderAnalytics();

  if (S.view === 'tasks') initKanbanDrag();
}

// ── Helpers ──
function today() { return new Date().toISOString().slice(0,10); }

function fmtDate(d) {
  if (!d) return null;
  const diff = Math.round((new Date(d+'T00:00:00') - new Date(today()+'T00:00:00')) / 86400000);
  if (diff === 0) return { label:'Bugun', cls:'soon' };
  if (diff === 1) return { label:'Ertaga', cls:'' };
  if (diff === -1) return { label:'Kecha', cls:'overdue' };
  if (diff < 0) return { label:`${Math.abs(diff)} kun o'tdi`, cls:'overdue' };
  return { label:`${diff} kun qoldi`, cls:'' };
}

function prBadge(p) {
  const m = { high:'🔴 Yuqori', medium:'🟡 O\'rta', low:'🟢 Past', none:'⚪ Oddiy' };
  return `<span class="badge badge-pr-${p}">${m[p]||p}</span>`;
}

function statusLabel(s) {
  const m = { todo:'Yangi', progress:'Jarayonda', blocked:'Bloklangan', done:'Tugagan', cancelled:'Bekor' };
  return m[s] || s;
}

function userName(id) {
  if (!id) return '';
  const u = S.users.find(u => u.id == id);
  return u ? u.name : '';
}

// ── DASHBOARD ──
function renderDashboard() {
  const t = today();
  const todayTasks = S.tasks.filter(x => x.due_date === t && x.status !== 'done' && x.status !== 'cancelled');
  const overdueTasks = S.tasks.filter(x => x.due_date && x.due_date < t && x.status !== 'done' && x.status !== 'cancelled');
  const done = S.tasks.filter(x => x.status === 'done').length;
  const inProg = S.tasks.filter(x => x.status === 'progress').length;
  const pct = S.tasks.length ? Math.round(done / S.tasks.length * 100) : 0;

  const taskRow = (task) => {
    const di = fmtDate(task.due_date);
    return `<div class="d-task" onclick="openModal(${task.id})">
      <span class="d-dot ${task.priority}"></span>
      <span class="d-ttitle">${esc(task.title)}</span>
      ${di ? `<span class="d-date ${di.cls}">${di.label}</span>` : ''}
    </div>`;
  };

  return `
    <div class="stat-row">
      <div class="stat-card sc-today"><div class="sl">Bugungi</div><div class="sv">${todayTasks.length}</div></div>
      <div class="stat-card sc-done"><div class="sl">Bajarildi</div><div class="sv">${done}</div></div>
      <div class="stat-card sc-prog"><div class="sl">Jarayonda</div><div class="sv">${inProg}</div></div>
      <div class="stat-card sc-over"><div class="sl">Kechikdi</div><div class="sv">${overdueTasks.length}</div></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-top"><span>Umumiy progress</span><span>${pct}%</span></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="dash-grid">
      <div class="d-card">
        <div class="d-title">Bugungi vazifalar (${todayTasks.length})</div>
        ${todayTasks.length ? todayTasks.map(taskRow).join('') : '<div class="d-empty">Bugun uchun vazifa yo\'q ✓</div>'}
      </div>
      <div class="d-card">
        <div class="d-title" style="color:var(--crit)">Kechikkan (${overdueTasks.length})</div>
        ${overdueTasks.length ? overdueTasks.map(taskRow).join('') : '<div class="d-empty">Kechikkan vazifa yo\'q ✓</div>'}
      </div>
    </div>
  `;
}

// ── TASKS ──
function renderTasks() {
  const TABS = [
    {k:'all', l:'Barchasi'},
    {k:'todo', l:'Yangi'},
    {k:'progress', l:'Jarayonda'},
    {k:'blocked', l:'Bloklangan'},
    {k:'done', l:'Tugagan'},
    {k:'cancelled', l:'Bekor'},
  ];

  const cats = (S.config.categories || []);
  const catOptions = ['<option value="">Barcha</option>', ...cats.map(c => `<option value="${c}"${S.filterCategory===c?' selected':''}>${c}</option>`)].join('');

  let visible = S.tasks;
  if (S.taskTab !== 'all') visible = visible.filter(t => t.status === S.taskTab);
  if (S.filterPriority) visible = visible.filter(t => t.priority === S.filterPriority);
  if (S.filterCategory) visible = visible.filter(t => t.category === S.filterCategory);

  const tabs = TABS.map(({k,l}) => `<button class="tab-btn${S.taskTab===k?' active':''}" onclick="setTab('${k}')">${l}</button>`).join('');

  const prFilter = `<select class="filter-sel" onchange="S.filterPriority=this.value;renderView()">
    <option value="">Muhimlik</option>
    <option value="high"${S.filterPriority==='high'?' selected':''}>Yuqori</option>
    <option value="medium"${S.filterPriority==='medium'?' selected':''}>O'rta</option>
    <option value="low"${S.filterPriority==='low'?' selected':''}>Past</option>
    <option value="none"${S.filterPriority==='none'?' selected':''}>Oddiy</option>
  </select>`;

  const catFilter = `<select class="filter-sel" onchange="S.filterCategory=this.value;renderView()">${catOptions}</select>`;

  const viewToggle = `<div class="view-toggle">
    <button class="vt-btn${S.taskView==='list'?' active':''}" onclick="S.taskView='list';renderView()" title="Ro'yxat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
    <button class="vt-btn${S.taskView==='kanban'?' active':''}" onclick="S.taskView='kanban';renderView()" title="Kanban">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="5" height="18"/><rect x="10" y="3" width="5" height="18"/><rect x="17" y="3" width="4" height="18"/></svg>
    </button>
  </div>`;

  const filterBar = `<div class="filter-bar">${tabs}${prFilter}${catFilter}${viewToggle}</div>`;

  let body = '';
  if (S.taskView === 'list') {
    if (!visible.length) {
      body = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12l3 3 5-5"/></svg><p>Vazifalar yo\'q</p></div>';
    } else {
      body = `<div class="task-list">${visible.map(renderTaskCard).join('')}</div>`;
    }
  } else {
    body = renderKanban(visible);
  }

  return filterBar + body;
}

function renderTaskCard(task) {
  const di = fmtDate(task.due_date);
  const done = task.status === 'done';
  const un = userName(task.assigned_to);
  return `<div class="task-card${done?' done-card':''}" onclick="openModal(${task.id})">
    <button class="check-btn${done?' checked':''}" onclick="event.stopPropagation();toggleDone(${task.id})">
      <svg viewBox="0 0 12 10" fill="none"><path d="M1 5l3.5 3.5L11 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="task-body">
      <div class="task-title-text">${esc(task.title)}</div>
      <div class="task-meta">
        ${prBadge(task.priority)}
        ${task.category ? `<span class="badge badge-cat">${esc(task.category)}</span>` : ''}
        ${di ? `<span class="badge-date ${di.cls}">📅 ${di.label}</span>` : ''}
        ${un ? `<span class="badge-date">👤 ${esc(un)}</span>` : ''}
        ${(task.subtasks||[]).length ? `<span class="badge-date">☑ ${task.subtasks.filter(s=>s.done).length}/${task.subtasks.length}</span>` : ''}
      </div>
    </div>
    <button class="task-del" onclick="event.stopPropagation();delTask(${task.id})">×</button>
  </div>`;
}

function renderKanban(tasks) {
  const COLS = [
    {s:'todo',    l:'Yangi',     col:'#6D7175'},
    {s:'progress',l:'Jarayonda', col:'#2C6ECB'},
    {s:'blocked', l:'Bloklangan',col:'#D72C0D'},
    {s:'done',    l:'Tugagan',   col:'#007A5A'},
    {s:'cancelled',l:'Bekor',    col:'#8C9196'},
  ];
  return `<div class="kanban">${COLS.map(({s,l,col}) => {
    const ct = tasks.filter(t => t.status === s);
    return `<div class="kb-col" data-status="${s}">
      <div class="kb-head">
        <span class="kb-label"><span class="kb-dot ${s}" style="background:${col}"></span>${l}</span>
        <span class="kb-count">${ct.length}</span>
      </div>
      <div class="kb-drop-zone" data-status="${s}" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="dropTask(event,'${s}')">
        ${ct.map(t => `<div class="kb-card" draggable="true" data-id="${t.id}" ondragstart="dragStart(event,${t.id})" onclick="openModal(${t.id})">
          <div class="kb-card-title">${esc(t.title)}</div>
          <div class="kb-card-meta">
            ${prBadge(t.priority)}
            ${t.due_date ? (()=>{const d=fmtDate(t.due_date);return d?`<span class="badge-date ${d.cls}">📅 ${d.label}</span>`:''})() : ''}
          </div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('')}</div>`;
}

// ── ANALYTICS ──
function renderAnalytics() {
  const cats = (S.config.categories || []);
  const total = S.tasks.length || 1;
  const catBars = cats.map(cat => {
    const n = S.tasks.filter(t => t.category === cat).length;
    const pct = Math.round(n / total * 100);
    return `<div class="bar-row">
      <span class="bar-lbl">${esc(cat)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="bar-val">${n}</span>
    </div>`;
  }).join('');

  const statuses = [
    {s:'todo',cls:'#6D7175',l:'Yangi'},
    {s:'progress',cls:'#2C6ECB',l:'Jarayonda'},
    {s:'blocked',cls:'#D72C0D',l:'Bloklangan'},
    {s:'done',cls:'#007A5A',l:'Tugagan'},
    {s:'cancelled',cls:'#8C9196',l:'Bekor'},
  ];
  const statusRows = statuses.map(({s,cls,l}) => {
    const n = S.tasks.filter(t => t.status === s).length;
    const pct = Math.round(n / total * 100);
    return `<div class="status-row">
      <span class="status-dot" style="background:${cls}"></span>
      <span class="status-lbl">${l}</span>
      <span class="status-cnt">${n}</span>
      <div class="bar-track" style="max-width:80px"><div class="bar-fill" style="width:${pct}%;background:${cls}"></div></div>
    </div>`;
  }).join('');

  const byPr = ['high','medium','low','none'].map(p => {
    const n = S.tasks.filter(t => t.priority === p).length;
    return `<div class="bar-row">
      <span class="bar-lbl">${{high:'Yuqori',medium:"O'rta",low:'Past',none:'Oddiy'}[p]}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/total*100)}%;background:${{high:'var(--crit)',medium:'var(--warn)',low:'var(--succ)',none:'var(--t3)'}[p]}"></div></div>
      <span class="bar-val">${n}</span>
    </div>`;
  }).join('');

  return `<div class="analytics-grid">
    <div class="a-card"><div class="a-title">Kategoriya bo'yicha</div>${catBars || '<p style="color:var(--t2);font-size:13px">Ma\'lumot yo\'q</p>'}</div>
    <div class="a-card"><div class="a-title">Status bo'yicha</div>${statusRows}</div>
    <div class="a-card"><div class="a-title">Muhimlik bo'yicha</div>${byPr}</div>
    <div class="a-card">
      <div class="a-title">Umumiy</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${[
          ['Jami vazifalar', S.tasks.length],
          ['Bugun bajariladigan', S.tasks.filter(t=>t.due_date===today()&&t.status!=='done').length],
          ['Kechikkan', S.tasks.filter(t=>t.due_date&&t.due_date<today()&&t.status!=='done'&&t.status!=='cancelled').length],
          ['Takrorlanadigan', S.tasks.filter(t=>t.recurring_type).length],
          ['Subtask bor', S.tasks.filter(t=>(t.subtasks||[]).length>0).length],
        ].map(([l,v]) => `<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px">
          <span style="color:var(--t2)">${l}</span><strong style="font-variant-numeric:tabular-nums">${v}</strong>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}

// TASK MODAL
// ═══════════════════════════════════════════════
function openModal(taskId) {
  S.editingTaskId = taskId || null;
  const task = taskId ? S.tasks.find(t => t.id == taskId) : null;

  document.getElementById('modal-title').textContent = task ? 'Vazifani tahrirlash' : 'Yangi vazifa';
  document.getElementById('modal-del-btn').style.display = task ? 'block' : 'none';

  document.getElementById('m-title').value = task?.title || '';
  document.getElementById('m-desc').value = task?.description || '';
  document.getElementById('m-status').value = task?.status || 'todo';
  document.getElementById('m-priority').value = task?.priority || 'medium';
  document.getElementById('m-due').value = task?.due_date || today();
  document.getElementById('m-end').value = task?.end_date || '';

  const cats = S.config.categories || [];
  document.getElementById('m-category').innerHTML = ['<option value="">Kategoriyasiz</option>',
    ...cats.map(c => `<option value="${c}"${task?.category===c?' selected':''}>${c}</option>`)].join('');

  document.getElementById('m-assigned').innerHTML = ['<option value="">Mas\'ulsiz</option>',
    ...S.users.map(u => `<option value="${u.id}"${task?.assigned_to==u.id?' selected':''}>${u.name}</option>`)].join('');

  const recOn = !!(task?.recurring_type);
  document.getElementById('m-recur-on').checked = recOn;
  document.getElementById('recur-body').classList.toggle('show', recOn);
  document.getElementById('m-recur-type').value = task?.recurring_type || 'daily';
  document.getElementById('m-recur-interval').value = task?.recurring_interval || 1;

  S.modalTags = [...(task?.tags || [])];
  renderTagChips();

  S.modalSubtasks = (task?.subtasks || []).map(s => ({...s}));
  renderSubtasks();

  S.modalComments = (task?.comments || []).map(c => ({...c}));
  renderComments();

  document.getElementById('task-modal').classList.add('show');
  setTimeout(() => document.getElementById('m-title').focus(), 100);
}

function closeModal() {
  document.getElementById('task-modal').classList.remove('show');
  S.editingTaskId = null;
}

async function saveTask() {
  const title = document.getElementById('m-title').value.trim();
  if (!title) { toast('Sarlavha majburiy', 'err'); return; }

  const recOn = document.getElementById('m-recur-on').checked;
  const payload = {
    title,
    description: document.getElementById('m-desc').value.trim(),
    status: document.getElementById('m-status').value,
    priority: document.getElementById('m-priority').value,
    category: document.getElementById('m-category').value,
    assigned_to: document.getElementById('m-assigned').value || null,
    due_date: document.getElementById('m-due').value || null,
    end_date: document.getElementById('m-end').value || null,
    recurring_type: recOn ? document.getElementById('m-recur-type').value : null,
    recurring_interval: recOn ? parseInt(document.getElementById('m-recur-interval').value)||1 : 1,
    tags: S.modalTags,
    subtasks: S.modalSubtasks,
    comments: S.modalComments,
  };

  try {
    let updated;
    if (S.editingTaskId) {
      updated = await api('PUT', `/tasks/${S.editingTaskId}`, payload);
      S.tasks = S.tasks.map(t => t.id == S.editingTaskId ? updated : t);
    } else {
      updated = await api('POST', '/tasks', payload);
      S.tasks = [updated, ...S.tasks];
    }
    closeModal();
    renderView();
    toast(S.editingTaskId ? 'Vazifa yangilandi' : 'Vazifa qo\'shildi', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

async function toggleDone(id) {
  const task = S.tasks.find(t => t.id == id);
  if (!task) return;
  const newStatus = task.status === 'done' ? 'todo' : 'done';
  try {
    const updated = await api('PUT', `/tasks/${id}`, { status: newStatus });
    S.tasks = S.tasks.map(t => t.id == id ? updated : t);
    renderView();
  } catch(e) { toast(e.message, 'err'); }
}

async function delTask(id) {
  if (!confirm('Vazifani o\'chirishni tasdiqlaysizmi?')) return;
  try {
    await api('DELETE', `/tasks/${id}`);
    S.tasks = S.tasks.filter(t => t.id != id);
    renderView();
    toast('Vazifa o\'chirildi');
  } catch(e) { toast(e.message, 'err'); }
}

async function deleteCurrentTask() {
  if (S.editingTaskId) { closeModal(); await delTask(S.editingTaskId); }
}

function renderTagChips() {
  const wrap = document.getElementById('tag-wrap');
  const input = document.getElementById('tag-input');
  wrap.innerHTML = '';
  S.modalTags.forEach((t, i) => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.innerHTML = `${esc(t)}<button onclick="S.modalTags.splice(${i},1);renderTagChips()">×</button>`;
    wrap.appendChild(chip);
  });
  wrap.appendChild(input);
}

function handleTagKey(e) {
  if ((e.key === 'Enter' || e.key === ',') && e.target.value.trim()) {
    e.preventDefault();
    const val = e.target.value.trim().replace(/,/g,'');
    if (val && !S.modalTags.includes(val)) { S.modalTags.push(val); renderTagChips(); }
    e.target.value = '';
  }
  if (e.key === 'Backspace' && !e.target.value && S.modalTags.length) {
    S.modalTags.pop(); renderTagChips();
  }
}

// ═══════════════════════════════════════════════
// SUBTASKS
// ═══════════════════════════════════════════════
function renderSubtasks() {
  const list = document.getElementById('sub-list');
  list.innerHTML = S.modalSubtasks.map((s, i) => `
    <div class="sub-item${s.done?' done':''}">
      <input type="checkbox" ${s.done?'checked':''} onchange="S.modalSubtasks[${i}].done=this.checked;renderSubtasks()">
      <span>${esc(s.title)}</span>
      <button onclick="S.modalSubtasks.splice(${i},1);renderSubtasks()">×</button>
    </div>`).join('');
}

function addSubtask() {
  const inp = document.getElementById('sub-input');
  const v = inp.value.trim();
  if (!v) return;
  S.modalSubtasks.push({ title: v, done: false });
  renderSubtasks();
  inp.value = '';
  inp.focus();
}

// ═══════════════════════════════════════════════
// COMMENTS
// ═══════════════════════════════════════════════
function renderComments() {
  const list = document.getElementById('comment-list');
  list.innerHTML = S.modalComments.map(c => `
    <div class="comment-item">
      <div class="comment-meta">${esc(c.author||'Foydalanuvchi')} · ${c.at ? new Date(c.at).toLocaleString('uz-UZ') : ''}</div>
      <div class="comment-text">${esc(c.text)}</div>
    </div>`).join('');
}

function addComment() {
  const ta = document.getElementById('comment-input');
  const text = ta.value.trim();
  if (!text) return;
  S.modalComments.push({ text, author: S.user?.name || '', at: new Date().toISOString() });
  renderComments();
  ta.value = '';
}

// ═══════════════════════════════════════════════
// RECURRING TOGGLE
// ═══════════════════════════════════════════════
function toggleRecur() {
  const on = document.getElementById('m-recur-on').checked;
  document.getElementById('recur-body').classList.toggle('show', on);
}

// ═══════════════════════════════════════════════
// KANBAN DRAG
// ═══════════════════════════════════════════════
let draggingId = null;
function dragStart(e, id) { draggingId = id; e.dataTransfer.effectAllowed = 'move'; }
async function dropTask(e, newStatus) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!draggingId) return;
  const task = S.tasks.find(t => t.id == draggingId);
  if (!task || task.status === newStatus) { draggingId = null; return; }
  try {
    const updated = await api('PUT', `/tasks/${draggingId}`, { status: newStatus });
    S.tasks = S.tasks.map(t => t.id == draggingId ? updated : t);
    renderView();
  } catch(e) { toast(e.message, 'err'); }
  draggingId = null;
}
function initKanbanDrag() {
  document.querySelectorAll('.kb-drop-zone').forEach(zone => {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  });
}

// ═══════════════════════════════════════════════
// SETTINGS ACTIONS
// ═══════════════════════════════════════════════
async function changeTheme(val) {
  S.config.theme = val;
  applyTheme(val);
  try { await api('PUT', '/config', { theme: val }); } catch(e) { toast(e.message,'err'); }
}

function applyTheme(val) {
  if (val === 'dark') document.documentElement.setAttribute('data-theme','dark');
  else if (val === 'light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
}

async function addCat() {
  const inp = document.getElementById('new-cat');
  const val = inp.value.trim();
  if (!val) return;
  if ((S.config.categories||[]).includes(val)) { toast('Bu kategoriya mavjud','err'); return; }
  S.config.categories = [...(S.config.categories||[]), val];
  try {
    await api('PUT', '/config', { categories: S.config.categories });
    inp.value = '';
    renderView();
    toast('Kategoriya qo\'shildi','ok');
  } catch(e) { toast(e.message,'err'); }
}

async function removeCat(cat) {
  if (!confirm(`"${cat}" kategoriyasini o'chirasizmi?`)) return;
  S.config.categories = (S.config.categories||[]).filter(c => c !== cat);
  try {
    await api('PUT', '/config', { categories: S.config.categories });
    renderView();
    toast('Kategoriya o\'chirildi');
  } catch(e) { toast(e.message,'err'); }
}

async function addUser() {
  const login = document.getElementById('nu-login').value.trim();
  const password = document.getElementById('nu-pass').value;
  const name = document.getElementById('nu-name').value.trim();
  const role = document.getElementById('nu-role').value;
  if (!login || !password || !name) { toast('Barcha maydonlarni to\'ldiring','err'); return; }
  try {
    const user = await api('POST', '/users', { login, password, name, role });
    S.users.push(user);
    document.getElementById('add-user-form').style.display = 'none';
    renderView();
    toast('Foydalanuvchi qo\'shildi','ok');
  } catch(e) { toast(e.message,'err'); }
}

async function delUser(id) {
  if (!confirm('Foydalanuvchini o\'chirasizmi?')) return;
  try {
    await api('DELETE', `/users/${id}`);
    S.users = S.users.filter(u => u.id != id);
    renderView();
    toast('Foydalanuvchi o\'chirildi');
  } catch(e) { toast(e.message,'err'); }
}

// ═══════════════════════════════════════════════
// TABS & FILTERS
// ═══════════════════════════════════════════════
function setTab(tab) { S.taskTab = tab; renderView(); }

// ═══════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════
function toast(msg, type) {
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'err' ? ' err' : type === 'ok' ? ' ok' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Login on Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-screen').classList.contains('show')) doLogin();
  if (e.key === 'Escape') closeModal();
});

// Close modal on backdrop click
document.getElementById('task-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('task-modal')) closeModal();
});

// ═══════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════
init();
</script>
